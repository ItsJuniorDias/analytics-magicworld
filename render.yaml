services:
  - type: web
    name: magic-world-analytics
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DEFAULT_CURRENCY
        value: BRL
      # ── App Store Server Notifications V2 ────────────────────────────────
      # With APPLE_BUNDLE_ID unset the webhook boots DISABLED and answers 503 —
      # on purpose: 503 makes Apple requeue, so nothing is lost while you
      # finish the setup.
      - key: APPLE_BUNDLE_ID
        sync: false                # must match the app's bundle id exactly
      - key: APPLE_APP_ID
        sync: false                # App Store Connect → App Information
      - key: APPLE_ENVIRONMENT
        value: Production          # use Sandbox on a SECOND service, never this one
      - key: SUB_HASH_SECRET
        generateValue: true        # ⚠️ generated ONCE; changing it orphans subscriptions
      - key: DATABASE_URL
        fromDatabase:
          name: magic-world-analytics-db
          property: connectionString

databases:
  - name: magic-world-analytics-db
    plan: free
    databaseName: magic_world_analytics
    user: magic_world_analytics
